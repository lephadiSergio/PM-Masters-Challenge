<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PM Masters — Active Arena</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
</head>
<body>
  <div class="bg-grid"></div>

  <div class="game-wrapper">
    <div class="game-topbar">
      <div id="myNameLabel" style="color:var(--cyan);">Player</div>
      <div id="questionProgressText" style="color:var(--text-secondary);">Task Queue</div>
      <div class="score-pill" id="localScoreLabel">0</div>
    </div>

    <div class="timer-track"><div class="timer-fill" id="timerFillBar"></div></div>

    <div class="q-card">
      <div class="q-topic" id="qTopicText">Topic</div>
      <div class="q-text" id="qBodyParagraphText">Loading vectors...</div>
      <div class="answers-grid" id="answersLayoutGrid"></div>
    </div>
  </div>

  <script src="data/questions.js"></script>
  <script>
    window.history.pushState(null, null, window.location.href);
    window.onpopstate = function () { window.location.replace('index.html'); };

    const myPlayerKey = localStorage.getItem('mp_myPlayerKey');
    const myPlayerName = localStorage.getItem('mp_myPlayerName');
    const activeLobbyNode = localStorage.getItem('mp_selectedLobbyNode');
    const mode = localStorage.getItem('mp_selectedMode');
    const tier = localStorage.getItem('mp_selectedTier');

    if (!myPlayerKey || !activeLobbyNode) { window.location.replace('index.html'); }

    const firebaseConfig = {
      apiKey: "AIzaSyDnImDBW3zqEZbBkgnQDLLmQiz_dWX5euk",
      projectId: "pmmasters-20a3b",
      databaseURL: "https://pmmasters-20a3b-default-rtdb.firebaseio.com"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const serverRoomRef = db.ref(`pm_masters_multiplayer_session/${activeLobbyNode}`);

    let CLOCK_TIME_LIMIT_MAX = 25; 
    if (mode === "exam") {
      if (tier === "level1") CLOCK_TIME_LIMIT_MAX = 90;
      if (tier === "level2") CLOCK_TIME_LIMIT_MAX = 180;
      if (tier === "level3") CLOCK_TIME_LIMIT_MAX = 300;
    }

    let questionBankArray = getSelectedLobbyDataset(mode, tier, activeLobbyNode);
    let currentQuestionIdx = 0;
    let localAccumulatedScore = 0;
    let turnCountDownTimerInterval = null;
    let clockSecondsTimeRemaining = CLOCK_TIME_LIMIT_MAX;
    let questionAnswerLockFlag = false;
    let localGamePlayReviewLog = [];

    serverRoomRef.child('gameState').once('value', (snap) => {
      if (snap.val() !== "active") { window.location.replace('index.html'); } 
      else { renderActiveQuestionRow(); }
    });

    function renderActiveQuestionRow() {
      if (currentQuestionIdx >= questionBankArray.length) {
        clearInterval(turnCountDownTimerInterval);
        localStorage.setItem('mp_lastMatchReviewDataLog', JSON.stringify(localGamePlayReviewLog));
        serverRoomRef.child('players').child(myPlayerKey).update({
          name: myPlayerName, status: "Finished Match"
        }).then(() => { window.location.replace('leaderboard.html'); });
        return;
      }

      questionAnswerLockFlag = false;
      const q = questionBankArray[currentQuestionIdx];
      document.getElementById('myNameLabel').textContent = myPlayerName;
      document.getElementById('questionProgressText').textContent = `Q: ${currentQuestionIdx + 1}/${questionBankArray.length}`;
      document.getElementById('localScoreLabel').textContent = `PTS: ${localAccumulatedScore}`;
      document.getElementById('qTopicText').textContent = q.topic;
      document.getElementById('qBodyParagraphText').textContent = q.question;

      const gridContainer = document.getElementById('answersLayoutGrid');
      gridContainer.innerHTML = '';

      q.answers.forEach((choiceText, index) => {
        const choiceBtn = document.createElement('button');
        choiceBtn.className = 'answer-btn';
        choiceBtn.textContent = choiceText;
        choiceBtn.onclick = () => validateSelectedChoiceOption(index);
        gridContainer.appendChild(choiceBtn);
      });

      kickstartClockCountdownTracker();
    }

    function kickstartClockCountdownTracker() {
      clearInterval(turnCountDownTimerInterval);
      clockSecondsTimeRemaining = CLOCK_TIME_LIMIT_MAX;
      turnCountDownTimerInterval = setInterval(() => {
        clockSecondsTimeRemaining -= 0.5;
        document.getElementById('timerFillBar').style.width = `${(clockSecondsTimeRemaining / CLOCK_TIME_LIMIT_MAX) * 100}%`;
        if (clockSecondsTimeRemaining <= 0) {
          clearInterval(turnCountDownTimerInterval); validateSelectedChoiceOption(-1);
        }
      }, 500);
    }

    function validateSelectedChoiceOption(selectedIdx) {
      if (questionAnswerLockFlag) return;
      questionAnswerLockFlag = true;
      clearInterval(turnCountDownTimerInterval);

      const q = questionBankArray[currentQuestionIdx];
      const isCorrect = (selectedIdx === q.correct);
      if (isCorrect) localAccumulatedScore += 10;

      localGamePlayReviewLog.push({
        questionText: q.question, topicText: q.topic, choicesList: q.answers,
        correctIdx: q.correct, playerSelectedIdx: selectedIdx,
        explanationText: q.explanation, wasCorrectFlag: isCorrect
      });

      serverRoomRef.child('players').child(myPlayerKey).update({
        score: localAccumulatedScore, status: `Answering Q${currentQuestionIdx + 2}`
      });

      currentQuestionIdx++;
      renderActiveQuestionRow();
    }
  </script>
</body>
</html>
