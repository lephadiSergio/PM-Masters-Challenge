<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PM Masters — Live Match Board</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
</head>
<body>
  <div class="bg-grid"></div>

  <div class="game-wrapper" id="gameWrapper">
    <div class="game-topbar">
      <div class="current-player-pill">
        <div class="cp-avatar" id="myAvatarIcon">ME</div>
        <div class="cp-name" id="myNameLabel">Player Name</div>
      </div>
      <img src="assets/logo.png" alt="PM" class="brand-logo-hud" onerror="this.style.display='none'">
      <div class="game-progress-info">
        <span id="questionProgressText">Q 1 / 10</span>
      </div>
      <div class="score-pill">
        <span class="score-label">LIVE SCORE</span>
        <span class="score-val" id="localScoreLabel">0</span>
      </div>
    </div>

    <div class="timer-track">
      <div class="timer-fill" id="timerFillBar"></div>
    </div>

    <div class="q-card" id="qCard">
      <div class="q-topic" id="qTopicText">Knowledge Area Category</div>
      <div class="q-number" id="qNumberLabel">Scenario Investigation</div>
      <div class="q-text" id="qBodyParagraphText">Processing exam array configuration settings...</div>
      <div class="answers-grid" id="answersLayoutGrid"></div>
    </div>
  </div>

  <script src="data/questions.js"></script>
  <script>
    const myPlayerKey = localStorage.getItem('mp_myPlayerKey');
    const myPlayerName = localStorage.getItem('mp_myPlayerName');
    if (!myPlayerKey || !myPlayerName) { window.location.href = 'index.html'; }

    const firebaseConfig = {
      apiKey: "AIzaSyDnImDBW3zqEZbBkgnQDLLmQiz_dWX5euk",
      projectId: "pmmasters-20a3b",
      databaseURL: "https://pmmasters-20a3b-default-rtdb.firebaseio.com"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const serverRoomRef = db.ref("pm_masters_multiplayer_session");

    // Pull 10 distinct short questions for this challenge flight
    let questionBankArray = getRandomQuestions(10);
    let currentQuestionIdx = 0;
    let localAccumulatedScore = 0;
    let turnCountDownTimerInterval = null;
    let clockSecondsTimeRemaining = 25;
    let questionAnswerLockFlag = false;

    let localGamePlayReviewLog = [];

    // TIMER CHANGED TO 25 SECONDS
    const CLOCK_TIME_LIMIT_MAX = 25;

    function renderActiveQuestionRow() {
      if (currentQuestionIdx >= questionBankArray.length) {
        clearInterval(turnCountDownTimerInterval);
        
        localStorage.setItem('mp_lastMatchReviewDataLog', JSON.stringify(localGamePlayReviewLog));

        serverRoomRef.child('players').child(myPlayerKey).update({
          name: myPlayerName,
          status: "Finished Match"
        }).then(() => {
          window.location.href = 'leaderboard.html';
        });
        return;
      }

      questionAnswerLockFlag = false;
      const q = questionBankArray[currentQuestionIdx];

      document.getElementById('myAvatarIcon').textContent = myPlayerName.substring(0,2).toUpperCase();
      document.getElementById('myNameLabel').textContent = myPlayerName;
      document.getElementById('questionProgressText').textContent = `Q ${currentQuestionIdx + 1} / ${questionBankArray.length}`;
      document.getElementById('localScoreLabel').textContent = localAccumulatedScore;

      document.getElementById('qTopicText').textContent = q.topic;
      document.getElementById('qNumberLabel').textContent = `Challenge ${currentQuestionIdx + 1}`;
      document.getElementById('qBodyParagraphText').textContent = q.question;

      const gridContainer = document.getElementById('answersLayoutGrid');
      gridContainer.innerHTML = '';

      q.answers.forEach((choiceText, index) => {
        const choiceBtn = document.createElement('button');
        choiceBtn.className = 'answer-btn';
        choiceBtn.textContent = choiceText;
        choiceBtn.onclick = () => validateSelectedChoiceOption(index);
        gridContainer.appendChild(choiceBtn);
      });

      kickstartClockCountdownTracker();
    }

    function kickstartClockCountdownTracker() {
      clearInterval(turnCountDownTimerInterval);
      clockSecondsTimeRemaining = CLOCK_TIME_LIMIT_MAX;
      syncCountdownTimerBarUI();

      turnCountDownTimerInterval = setInterval(() => {
        clockSecondsTimeRemaining -= 0.1;
        syncCountdownTimerBarUI();

        if (clockSecondsTimeRemaining <= 0) {
          clearInterval(turnCountDownTimerInterval);
          validateSelectedChoiceOption(-1);
        }
      }, 100);
    }

    function syncCountdownTimerBarUI() {
      const percentageLeft = (clockSecondsTimeRemaining / CLOCK_TIME_LIMIT_MAX) * 100;
      document.getElementById('timerFillBar').style.width = `${percentageLeft}%`;
    }

    function validateSelectedChoiceOption(selectedIdx) {
      if (questionAnswerLockFlag) return;
      questionAnswerLockFlag = true;
      clearInterval(turnCountDownTimerInterval);

      const q = questionBankArray[currentQuestionIdx];
      const isCorrect = (selectedIdx === q.correct);
      
      let gainedPoints = 0;
      if (isCorrect) {
        gainedPoints = 7;
        // Lightning bonus adjusted proportionally for answers submitted in under 6 seconds
        if (clockSecondsTimeRemaining >= 19) { gainedPoints += 2; }
        localAccumulatedScore += gainedPoints;
      }

      localGamePlayReviewLog.push({
        questionText: q.question,
        topicText: q.topic,
        choicesList: q.answers,
        correctIdx: q.correct,
        playerSelectedIdx: selectedIdx,
        explanationText: q.explanation,
        wasCorrectFlag: isCorrect
      });

      serverRoomRef.child('players').child(myPlayerKey).update({
        name: myPlayerName,
        score: localAccumulatedScore,
        status: `Answering Q${currentQuestionIdx + 2}`
      });

      currentQuestionIdx++;
      renderActiveQuestionRow();
    }

    renderActiveQuestionRow();
  </script>
</body>
</html>
