<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PM Masters — Live Match Board</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
</head>
<body>
  <div class="bg-grid"></div>

  <!-- Real-time Response Feedback Card Visual Panel Module Layout -->
  <div class="feedback-overlay" id="feedbackOverlay">
    <div class="feedback-content">
      <div class="feedback-icon" id="feedbackIcon">✅</div>
      <div class="feedback-title" id="feedbackTitle">Correct!</div>
      <div class="feedback-points" id="feedbackPoints">+7 pts</div>
      <div class="feedback-explanation" id="feedbackExplanation">Loading question details...</div>
    </div>
  </div>

  <div class="game-wrapper" id="gameWrapper">
    <!-- Active Scoreboard Context Indicators HUD Element Header -->
    <div class="game-topbar">
      <div class="current-player-pill">
        <div class="cp-avatar" id="myAvatarIcon">ME</div>
        <div class="cp-name" id="myNameLabel">Player Name</div>
      </div>
      <img src="assets/logo.png" alt="PM" class="brand-logo-hud" onerror="this.style.display='none'">
      <div class="game-progress-info">
        <span id="questionProgressText">Q 1 / 15</span>
      </div>
      <div class="score-pill">
        <span class="score-label">LIVE SCORE</span>
        <span class="score-val" id="localScoreLabel">0</span>
      </div>
    </div>

    <!-- Live Linear Dynamic Countdown Progress Bar Wrapper Track -->
    <div class="timer-track">
      <div class="timer-fill" id="timerFillBar"></div>
    </div>

    <!-- Central Interactive Examination Interface Component Module Layout -->
    <div class="q-card" id="qCard">
      <div class="q-topic" id="qTopicText">Knowledge Area Category</div>
      <div class="q-number" id="qNumberLabel">Scenario Investigation</div>
      <div class="q-text" id="qBodyParagraphText">Processing exam array configuration settings...</div>
      <div class="answers-grid" id="answersLayoutGrid"></div>
    </div>
  </div>

  <script src="data/questions.js"></script>
  <script>
    // Validate configuration paths mapping parameters matching memory cache parameters
    const myPlayerKey = localStorage.getItem('mp_myPlayerKey');
    const myPlayerName = localStorage.getItem('mp_myPlayerName');
    if (!myPlayerKey || !myPlayerName) { window.location.href = 'index.html'; }

    // Hardcoded Connection Initializers Mapping Credentials Link Configurations
    const firebaseConfig = {
      apiKey: "AIzaSyDnImDBW3zqEZbBkgnQDLLmQiz_dWX5euk",
      projectId: "pmmasters-20a3b",
      databaseURL: "https://pmmasters-20a3b-default-rtdb.firebaseio.com"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const serverRoomRef = db.ref("pm_masters_multiplayer_session");

    let questionBankArray = getRandomQuestions(15);
    let currentQuestionIdx = 0;
    let localAccumulatedScore = 0;
    let turnCountDownTimerInterval = null;
    let clockSecondsTimeRemaining = 20;
    let questionAnswerLockFlag = false;

    const CLOCK_TIME_LIMIT_MAX = 20;

    function renderActiveQuestionRow() {
      if (currentQuestionIdx >= 15) {
        clearInterval(turnCountDownTimerInterval);
        // Flag player as finalized inside server cluster records array structures
        serverRoomRef.child('players').child(myPlayerKey).update({
          status: "Finished Match"
        }).then(() => {
          window.location.href = 'leaderboard.html';
        });
        return;
      }

      questionAnswerLockFlag = false;
      const q = questionBankArray[currentQuestionIdx];

      // Re-populate system HUD metric configurations strings
      document.getElementById('myAvatarIcon').textContent = myPlayerName.substring(0,2).toUpperCase();
      document.getElementById('myNameLabel').textContent = myPlayerName;
      document.getElementById('questionProgressText').textContent = `Q ${currentQuestionIdx + 1} / 15`;
      document.getElementById('localScoreLabel').textContent = localAccumulatedScore;

      document.getElementById('qTopicText').textContent = q.topic;
      document.getElementById('qNumberLabel').textContent = `Scenario Challenge ${currentQuestionIdx + 1}`;
      document.getElementById('qBodyParagraphText').textContent = q.question;

      const gridContainer = document.getElementById('answersLayoutGrid');
      gridContainer.innerHTML = '';

      q.answers.forEach((choiceText, index) => {
        const choiceBtn = document.createElement('button');
        choiceBtn.className = 'answer-btn';
        choiceBtn.textContent = choiceText;
        choiceBtn.onclick = () => validateSelectedChoiceOption(index);
        gridContainer.appendChild(choiceBtn);
      });

      kickstartClockCountdownTracker();
    }

    function kickstartClockCountdownTracker() {
      clearInterval(turnCountDownTimerInterval);
      clockSecondsTimeRemaining = CLOCK_TIME_LIMIT_MAX;
      syncCountdownTimerBarUI();

      turnCountDownTimerInterval = setInterval(() => {
        clockSecondsTimeRemaining -= 0.1;
        syncCountdownTimerBarUI();

        if (clockSecondsTimeRemaining <= 0) {
          clearInterval(turnCountDownTimerInterval);
          processScoreCalculations(-1, false); // Handle default timeout trigger
        }
      }, 100);
    }

    function syncCountdownTimerBarUI() {
      const percentageLeft = (clockSecondsTimeRemaining / CLOCK_TIME_LIMIT_MAX) * 100;
      document.getElementById('timerFillBar').style.width = `${percentageLeft}%`;
    }

    function validateSelectedChoiceOption(selectedIdx) {
      if (questionAnswerLockFlag) return;
      questionAnswerLockFlag = true;
      clearInterval(turnCountDownTimerInterval);

      const q = questionBankArray[currentQuestionIdx];
      const checkCorrectness = (selectedIdx === q.correct);
      processScoreCalculations(selectedIdx, checkCorrectness);
    }

    function processScoreCalculations(idx, correct) {
      const q = questionBankArray[currentQuestionIdx];
      let gainedPoints = 0;
      let lightningSpeedBonusTriggered = false;

      if (correct) {
        gainedPoints = 7;
        // Verify lightning speed metrics criteria (Answer provided within initial 6 seconds)
        if (clockSecondsTimeRemaining >= 14) {
          gainedPoints += 2;
          lightningSpeedBonusTriggered = true;
        }
        localAccumulatedScore += gainedPoints;

        // Instantly transmit updated score straight to Firebase real-time cluster strings
        serverRoomRef.child('players').child(myPlayerKey).update({
          score: localAccumulatedScore,
          status: `Answering Q${currentQuestionIdx + 2}`
        });
      }

      // Configure immediate presentation display panel parameters overlay elements
      const modal = document.getElementById('feedbackOverlay');
      const icon = document.getElementById('feedbackIcon');
      const title = document.getElementById('feedbackTitle');
      const pointsLabel = document.getElementById('feedbackPoints');
      
      document.getElementById('feedbackExplanation').textContent = q.explanation;

      if (idx === -1) {
        icon.textContent = '⏰';
        title.textContent = "Time Expired!";
        pointsLabel.textContent = "+0 pts (Out of Time)";
        pointsLabel.className = "feedback-points zero";
      } else if (correct) {
        icon.textContent = lightningSpeedBonusTriggered ? '⚡' : '✅';
        title.textContent = lightningSpeedBonusTriggered ? 'Lightning Speed!' : 'Correct Target!';
        pointsLabel.textContent = `+${gainedPoints} pts ${lightningSpeedBonusTriggered ? '(Includes Velocity Bonus)' : ''}`;
        pointsLabel.className = "feedback-points positive";
      } else {
        icon.textContent = '❌';
        title.textContent = "Incorrect Vector!";
        pointsLabel.textContent = "+0 pts";
        pointsLabel.className = "feedback-points zero";
      }

      modal.classList.add('active');

      setTimeout(() => {
        modal.classList.remove('active');
        currentQuestionIdx++;
        renderActiveQuestionRow();
      }, 2800);
    }

    // Initialize display layout elements logic pipeline configuration structures
    renderActiveQuestionRow();
  </script>
</body>
</html>
