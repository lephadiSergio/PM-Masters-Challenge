<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PM Masters — Solutions Inspector</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="bg-grid"></div>

  <div class="lb-container" style="max-width:650px;">
    <div class="lb-header">
      <h1 class="lb-title">Performance <span>Review</span></h1>
      <p class="lb-subtitle">Analysis Framework & Solutions Desk</p>
    </div>

    <div id="summaryCardsContainer"></div>

    <button class="action-btn primary" onclick="window.location.replace('index.html');" style="margin-top:20px;">Return to Main Hub 🏠</button>
  </div>

  <script>
    window.history.pushState(null, null, window.location.href);
    window.onpopstate = function () { window.location.replace('index.html'); };

    const logs = JSON.parse(localStorage.getItem('mp_lastMatchReviewDataLog') || '[]');
    const container = document.getElementById('summaryCardsContainer');

    if (logs.length === 0) {
      container.innerHTML = `<p style="color:var(--text-secondary);">No review data log found. Play a round first!</p>`;
    } else {
      logs.forEach((item, idx) => {
        const card = document.createElement('div');
        card.className = 'review-card';
        
        const badgeColor = item.wasCorrectFlag ? 'var(--green)' : 'var(--pink)';
        const badgeText = item.wasCorrectFlag ? 'CORRECT' : 'INCORRECT / TIMEOUT';

        const playerAnswerText = item.playerSelectedIdx !== -1 ? item.choicesList[item.playerSelectedIdx] : "None (Timeout/No Answer)";
        const correctAnswerText = item.choicesList[item.correctIdx];

        card.innerHTML = `
          <div style="display:flex; justify-content:space-between; margin-bottom:10px; font-size:0.8rem; font-weight:bold;">
            <span style="color:var(--cyan);">${item.topicText.toUpperCase()}</span>
            <span style="color:${badgeColor};">${badgeText}</span>
          </div>
          <p style="font-size:1rem; font-weight:600; margin-bottom:12px; color:#fff;">${idx + 1}. ${item.questionText}</p>
          <div style="font-size:0.85rem; margin-bottom:10px; padding:8px; border-radius:4px; background:rgba(255,0,127,0.05); border-left:3px solid var(--pink);">
            <strong style="color:var(--text-secondary);">Your Selection:</strong> <span style="color:#fff;">${playerAnswerText}</span>
          </div>
          <div style="font-size:0.85rem; margin-bottom:12px; padding:8px; border-radius:4px; background:rgba(0,255,135,0.05); border-left:3px solid var(--green);">
            <strong style="color:var(--text-secondary);">Correct Answer:</strong> <span style="color:#fff;">${correctAnswerText}</span>
          </div>
          <p style="font-size:0.85rem; color:var(--text-secondary); line-height:1.4; background:rgba(255,255,255,0.02); padding:10px; border-radius:4px;"><strong style="color:var(--gold);">Solution Note:</strong> ${item.explanationText}</p>
        `;
        container.appendChild(card);
      });
    }
  </script>
</body>
</html>
