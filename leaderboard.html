<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PM Masters — Live Standings</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
</head>
<body>
  <div class="bg-grid"></div>

  <div class="lb-container">
    <div class="lb-header">
      <h1 class="lb-title">Live <span>Podium</span></h1>
      <p class="lb-subtitle" id="lobbyIdentitySubtitle">Tracking metrics...</p>
    </div>

    <div class="results-list" id="liveScoreboardDisplayContainer" style="margin-bottom: 24px;"></div>

    <div class="lb-actions" style="display: flex; flex-direction: column; gap: 12px;">
      <button class="action-btn primary" id="goToSummaryPageBtn">Review Mistakes & Solutions 📊</button>
      <button class="action-btn secondary" id="lobbyResetBtn">Clear Channel & Exit Room 🔄</button>
    </div>
  </div>

  <script src="data/questions.js"></script>
  <script>
    window.history.pushState(null, null, window.location.href);
    window.onpopstate = function () { window.location.replace('index.html'); };

    const activeLobbyNode = localStorage.getItem('mp_selectedLobbyNode');
    const mode = localStorage.getItem('mp_selectedMode');
    const tier = localStorage.getItem('mp_selectedTier');

    const firebaseConfig = {
      apiKey: "AIzaSyDnImDBW3zqEZbBkgnQDLLmQiz_dWX5euk",
      projectId: "pmmasters-20a3b",
      databaseURL: "https://pmmasters-20a3b-default-rtdb.firebaseio.com"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const serverRoomRef = db.ref(`pm_masters_multiplayer_session/${activeLobbyNode}`);

    document.getElementById('lobbyIdentitySubtitle').textContent = `Lobby Room: ${activeLobbyNode.replace('lobby_','').toUpperCase()}`;

    let totalTasksCount = getSelectedLobbyDataset(mode, tier).length;
    const MAX_THEORETICAL_POINTS = totalTasksCount * 10;

    serverRoomRef.child('players').on('value', (snapshot) => {
      const recordsMap = snapshot.val() || {};
      const roster = Object.keys(recordsMap).map(keyId => {
        const item = recordsMap[keyId];
        return {
          name: item.name || "Gladiator", raw: item.score || 0,
          percentage: Math.min(100, Math.round(((item.score || 0) / MAX_THEORETICAL_POINTS) * 100)),
          status: item.status || "Active"
        };
      }).sort((a, b) => b.raw - a.raw);

      const container = document.getElementById('liveScoreboardDisplayContainer');
      container.innerHTML = '';

      roster.forEach((playerNode, index) => {
        const rankPrefix = (index === 0) ? "🥇" : (index === 1) ? "🥈" : (index === 2) ? "🥉" : `#${index + 1}`;
        const row = document.createElement('div');
        row.className = 'res-row';
        if (index === 0) row.style.border = "1px solid var(--gold)";

        row.innerHTML = `
          <div>
            <span style="font-weight:700; margin-right:8px;">${rankPrefix}</span>
            <span style="color:#fff; font-weight:600;">${playerNode.name}</span>
          </div>
          <span style="color:var(--cyan); font-weight:700;">${playerNode.percentage}%</span>
        `;
        container.appendChild(row);
      });
    });

    document.getElementById('goToSummaryPageBtn').addEventListener('click', () => { window.location.replace('summary.html'); });
    document.getElementById('lobbyResetBtn').addEventListener('click', () => {
      serverRoomRef.set(null).then(() => { localStorage.clear(); window.location.replace('index.html'); });
    });
  </script>
</body>
</html>
