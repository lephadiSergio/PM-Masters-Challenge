<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PM Masters · Standings</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="bg-grid"></div>

  <div class="lb-container">
    <div class="lb-header">
      <img src="assets/logo.png" alt="PM Masters Logo" class="brand-logo-main" style="margin: 0 auto 10px; display: block;" onerror="this.style.display='none'">
      <h1 class="lb-title">Tournament <span>Results</span></h1>
      <p class="lb-subtitle">Round Complete · Champion Status Unlocked</p>
    </div>

    <div class="champion-card" id="championCard">
      <div class="champion-crown">👑</div>
      <div class="champion-avatar" id="champAvatar">🥇</div>
      <div class="champion-name" id="champName">Evaluating...</div>
      <div>
        <span class="champion-score" id="champScore">0</span>
        <span class="champion-label">/100 Points</span>
      </div>
      <div class="champion-badge" id="champBadge">Project Champion</div>
    </div>

    <div class="results-list" id="resultsList"></div>

    <div class="hall-section">
      <h2 class="hall-title">🏅 All-Time High Scores (Hall of Fame)</h2>
      <div class="hall-list" id="hallList">
        <div class="hall-empty">No records stored yet.</div>
      </div>
    </div>

    <div class="lb-actions">
      <button class="action-btn primary" id="playAgainBtn">Rematch 🔄</button>
      <button class="action-btn secondary" id="newPlayersBtn">New Lobby 👥</button>
      <button class="action-btn danger" id="clearBtn">Wipe History 🗑️</button>
    </div>
  </div>

  <script>
    const players = JSON.parse(localStorage.getItem('pmPlayers') || '[]');
    const rawScores = JSON.parse(localStorage.getItem('pmScores') || '{}');

    const Q_COUNT = 15;
    const MAX_POTENTIAL_RAW = Q_COUNT * 9; // 7 points base + 2 points speed bonus max per question

    function calculatePercentage(raw) {
      return Math.min(100, Math.round((raw / MAX_POTENTIAL_RAW) * 100));
    }

    // Process and sort the active round standings data list array
    const sortedStandings = players.map(name => {
      const raw = rawScores[name] || 0;
      return { name, raw, score: calculatePercentage(raw) };
    }).sort((a, b) => b.raw - a.raw);

    // Build the scoreboard interface elements
    if (sortedStandings.length > 0) {
      const champ = sortedStandings[0];
      document.getElementById('champAvatar').textContent = champ.name.substring(0,2).toUpperCase();
      document.getElementById('champName').textContent = champ.name;
      document.getElementById('champScore').textContent = champ.score;

      // Assign custom functional dynamic badges based on score achievements
      const badgeEl = document.getElementById('champBadge');
      if (champ.score >= 85) { badgeEl.textContent = "Elite Program Director 🧠"; }
      else if (champ.score >= 65) { badgeEl.textContent = "Senior Scrum Master ⚔️"; }
      else { badgeEl.textContent = "Project Coordinator 📋"; }

      // Build secondary roster items below #1
      const rosterContainer = document.getElementById('resultsList');
      rosterContainer.innerHTML = '';
      
      for (let i = 1; i < sortedStandings.length; i++) {
        const p = sortedStandings[i];
        const row = document.createElement('div');
        row.className = 'res-row';
        row.innerHTML = `
          <div class="res-player">
            <span class="res-rank">#${i + 1}</span>
            <span class="res-name">${p.name}</span>
          </div>
          <span class="res-score">${p.score}%</span>
        `;
        rosterContainer.appendChild(row);
      }
    }

    // Historical Hall of Fame operational logic
    function registerHistoricalRecord(currentResults) {
      let archive = JSON.parse(localStorage.getItem('pmHallOfFame') || '[]');
      
      currentResults.forEach(entry => {
        archive.push({
          name: entry.name,
          score: entry.score,
          date: new Date().toLocaleDateString(undefined, {month: 'short', day: 'numeric'})
        });
      });

      // Sort globally by score desc and cap file rows length output capacity to 6 slots
      archive.sort((a, b) => b.score - a.score);
      archive = archive.slice(0, 6);
      
      localStorage.setItem('pmHallOfFame', JSON.stringify(archive));
      renderHistoricalLayout(archive);
    }

    function renderHistoricalLayout(archive) {
      const container = document.getElementById('hallList');
      if (!archive || archive.length === 0) {
        container.innerHTML = `<div class="hall-empty">No legendary records logged yet.</div>`;
        return;
      }

      container.innerHTML = archive.map((item, idx) => `
        <div class="hall-row">
          <div><span style="color:var(--gold); margin-right:8px;">#${idx+1}</span><span class="hall-name">${item.name}</span></div>
          <div style="display:flex; gap:16px;">
            <span style="color:var(--text3); font-size:0.75rem;">${item.date}</span>
            <span class="hall-score">${item.score}%</span>
          </div>
        </div>
      `).join('');
    }

    // Execute database pipeline updates upon layout initialization
    registerHistoricalRecord(sortedStandings);

    // Event listener configurations
    document.getElementById('playAgainBtn').addEventListener('click', () => {
      localStorage.removeItem('pmScores');
      localStorage.removeItem('pmCurrentPlayer');
      window.location.href = 'game.html';
    });

    document.getElementById('newPlayersBtn').addEventListener('click', () => {
      localStorage.removeItem('pmScores');
      localStorage.removeItem('pmCurrentPlayer');
      localStorage.removeItem('pmPlayers');
      window.location.href = 'index.html';
    });

    document.getElementById('clearBtn').addEventListener('click', () => {
      if (confirm('Are you sure you want to completely delete the Hall of Fame historical records?')) {
        localStorage.removeItem('pmHallOfFame');
        renderHistoricalLayout([]);
      }
    });
  </script>
</body>
</html>
