<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PM Masters Challenge — Lobby</title>
  <link rel="stylesheet" href="style.css" />
  <!-- Firebase Compat Libraries -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
</head>
<body>
  <div class="bg-grid"></div>

  <div class="landing-container">
    <div class="logo-area">
      <img src="assets/logo.png" alt="PM Masters Crest" class="brand-logo-main" onerror="this.style.display='none'">
      <h1 class="game-title">PM Masters<span class="accent">Challenge</span></h1>
      <p class="subtitle">Real-Time Multiplayer Arena</p>
    </div>

    <div class="player-setup-card">
      <!-- Entry View Screen -->
      <div id="joinView">
        <h2 class="setup-title">Enter Tournament</h2>
        <div class="player-inputs">
          <div class="player-row" id="inputWrapper">
            <div class="player-avatar">⚙️</div>
            <input type="text" id="usernameInput" class="player-input" placeholder="Your Gladiator Name..." maxlength="14" />
          </div>
        </div>
        <button class="start-btn ready" id="joinBtn">Connect to Stadium ⚡</button>
      </div>

      <!-- Live Lobby Waiting Room View -->
      <div id="lobbyView" style="display: none;">
        <h2 class="setup-title">Live Stadium Roster <span class="player-count-badge" id="liveCountLabel">0 Players</span></h2>
        <div class="player-inputs" id="liveLobbyRoster" style="margin-bottom: 24px; max-height: 240px; overflow-y: auto;">
          <!-- Active connected players populate live here -->
        </div>
        <div class="setup-info">
          <div class="info-chip">🎯 15 Random Questions</div>
          <div class="info-chip">⏰ 20s Live Clock</div>
          <div class="info-chip">📱 Cross-Device Sync</div>
        </div>
        <button class="start-btn" id="launchMatchBtn" disabled>Waiting for Host...</button>
      </div>
      <p class="footer-note" style="margin-top: 15px;">Powered by Firebase Realtime Cluster Engine</p>
    </div>
  </div>

  <script>
    // HARDCODED DB CONFIGURATION KEYS
    const firebaseConfig = {
      apiKey: "AIzaSyDnImDBW3zqEZbBkgnQDLLmQiz_dWX5euk",
      authDomain: "pmmasters-20a3b.firebaseapp.com",
      projectId: "pmmasters-20a3b",
      storageBucket: "pmmasters-20a3b.firebasestorage.app",
      messagingSenderId: "776685093484",
      appId: "1:776685093484:web:4fb70b55df26123c160e49",
      measurementId: "G-GFKTLE9DBG",
      databaseURL: "https://pmmasters-20a3b-default-rtdb.firebaseio.com"
    };

    // Initialize Connection Instance
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const serverRoomRef = db.ref("pm_masters_multiplayer_session");

    let myPlayerKey = null;
    let localPlayerName = "";

    const usernameInput = document.getElementById('usernameInput');
    usernameInput.addEventListener('focus', () => document.getElementById('inputWrapper').classList.add('focused'));
    usernameInput.addEventListener('blur', () => document.getElementById('inputWrapper').classList.remove('focused'));

    // Handle Joining Action Entry Pipeline
    document.getElementById('joinBtn').addEventListener('click', () => {
      localPlayerName = usernameInput.value.trim();
      if (!localPlayerName) { alert("Please type your name before entering!"); return; }

      // Append data node record structure securely to cloud roster session
      const playerRecordRef = serverRoomRef.child('players').push();
      myPlayerKey = playerRecordRef.key;

      // Save credentials locally inside cache memory so other screens remember us
      localStorage.setItem('mp_myPlayerKey', myPlayerKey);
      localStorage.setItem('mp_myPlayerName', localPlayerName);

      // Save initial data array state mapping parameters inside Firebase clusters
      playerRecordRef.set({
        name: localPlayerName,
        score: 0,
        status: "Lobby waiting..."
      });

      // Crucial safe disconnect guard feature: Automatically wipes player node out of the room if they close their browser tab
      playerRecordRef.onDisconnect().remove();

      // Shift interface view models seamlessly
      document.getElementById('joinView').style.display = 'none';
      document.getElementById('lobbyView').style.display = 'block';
    });

    // Continuously monitor room synchronization updates
    serverRoomRef.on('value', (snapshot) => {
      const data = snapshot.val() || {};
      const playersList = data.players || {};
      const currentGameState = data.gameState || 'lobby';

      const totalConnected = Object.keys(playersList).length;
      document.getElementById('liveCountLabel').textContent = `${totalConnected} Players`;

      // Draw the names of everyone connected on their different mobile devices
      const rosterElement = document.getElementById('liveLobbyRoster');
      rosterElement.innerHTML = '';
      
      Object.keys(playersList).forEach(key => {
        const p = playersList[key];
        const isMeLabel = (key === myPlayerKey) ? " (You)" : "";
        rosterElement.innerHTML += `
          <div class="player-row">
            <div class="player-avatar">${p.name.substring(0,2).toUpperCase()}</div>
            <div class="player-input" style="color:#fff; font-weight:600; padding-left:5px;">${p.name}${isMeLabel}</div>
            <div class="player-count-badge" style="background:#000; border-color:var(--purple); color:var(--purple); font-size:0.7rem;">${p.status}</div>
          </div>
        `;
      });

      // Host management parameters activation layout
      const launcherBtn = document.getElementById('launchMatchBtn');
      if (totalConnected >= 1) {
        launcherBtn.disabled = false;
        launcherBtn.classList.add('ready');
        launcherBtn.innerHTML = `Launch Battle Arena 🚀`;
      } else {
        launcherBtn.disabled = true;
        launcherBtn.classList.remove('ready');
        launcherBtn.innerHTML = `Waiting for Combatants...`;
      }

      // Synchronized redirect command validation node execution pipeline
      if (currentGameState === 'playing') {
        window.location.href = 'game.html';
      }
    });

    // Clicking launch pushes a signal to database forcing all browsers to load simultaneously
    document.getElementById('launchMatchBtn').addEventListener('click', () => {
      serverRoomRef.update({ gameState: 'playing' });
    });
  </script>
</body>
</html>
