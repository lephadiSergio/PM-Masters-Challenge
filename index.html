<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PM Masters — Arena Lobby</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
</head>
<body>
  <div class="bg-grid"></div>

  <div class="lb-container" style="max-width: 480px;">
    <div class="lb-header">
      <img src="assets/logo.png" alt="PM Masters Logo" class="brand-logo-main" style="margin: 0 auto 10px; display: block;" onerror="this.style.display='none'">
      <h1 class="lb-title">Battle <span>Lobby</span></h1>
      <p class="lb-subtitle">Secure your identity to join the session</p>
    </div>

    <!-- Phase 1: Name Entry View Form Box Section Module -->
    <div id="authFormViewBlock">
      <div style="margin-bottom: 20px; text-align: left;">
        <label style="color: var(--text3); font-family: 'Share Tech Mono'; display:block; margin-bottom:8px;">ENTER GLADIATOR NAME:</label>
        <input type="text" id="playerJoinNameInput" placeholder="e.g., GIORGIO MAX" maxlength="14" style="width:100%; padding:14px; background:rgba(255,255,255,0.05); border:1px solid var(--border); border-radius:8px; color:#fff; font-size:1.1rem; font-weight:600; outline:none; text-transform:uppercase;">
      </div>
      <button class="action-btn primary" id="enterLobbyRoomBtn" style="width:100%;">Connect to Server Cluster 📡</button>
    </div>

    <!-- Phase 2: Live Waitroom View (Hidden Initially) -->
    <div id="waitroomViewBlock" style="display: none;">
      <div style="background: rgba(255,0,127,0.05); border: 1px dashed var(--pink); padding: 12px; border-radius: 8px; margin-bottom: 20px;">
        <p style="color: var(--pink); font-family: 'Share Tech Mono'; font-weight: bold; margin: 0; animation: pulse 1.5s infinite;">⏳ WAITING FOR HOST TO START THE MATCH...</p>
      </div>

      <h3 style="color:#fff; text-align:left; font-family:'Share Tech Mono'; margin-bottom:12px;">CONNECTED PLAYERS:</h3>
      <div id="lobbyRosterLiveContainer" style="display:flex; flex-direction:column; gap:8px; margin-bottom:24px; max-height:200px; overflow-y:auto;">
        <!-- Filled dynamically -->
      </div>

      <button class="action-btn primary" id="hostLaunchMatchBtn" style="width:100%; background: linear-gradient(135deg, var(--gold), var(--purple)); display:none;">Launch Match For Everyone 🚀</button>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDnImDBW3zqEZbBkgnQDLLmQiz_dWX5euk",
      projectId: "pmmasters-20a3b",
      databaseURL: "https://pmmasters-20a3b-default-rtdb.firebaseio.com"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const serverRoomRef = db.ref("pm_masters_multiplayer_session");

    let uniqueAssignedPlayerKey = localStorage.getItem('mp_myPlayerKey') || null;

    // Track active connection variables pipelines
    document.getElementById('enterLobbyRoomBtn').addEventListener('click', () => {
      const parsedNameInput = document.getElementById('playerJoinNameInput').value.trim().toUpperCase();
      if (!parsedNameInput) { alert("Please type in a valid name first!"); return; }

      if (!uniqueAssignedPlayerKey) {
        uniqueAssignedPlayerKey = serverRoomRef.child('players').push().key;
        localStorage.setItem('mp_myPlayerKey', uniqueAssignedPlayerKey);
      }
      localStorage.setItem('mp_myPlayerName', parsedNameInput);

      // Register onto the backend cluster node matrix tracking variables
      serverRoomRef.child('players').child(uniqueAssignedPlayerKey).set({
        name: parsedNameInput,
        score: 0,
        status: "In Lobby"
      }).then(() => {
        // Swap viewing layouts smoothly
        document.getElementById('authFormViewBlock').style.display = 'none';
        document.getElementById('waitroomViewBlock').style.display = 'block';
        activateLobbyLiveStreamingListeners();
      });
    });

    function activateLobbyLiveStreamingListeners() {
      // 1. Monitor game state to see if a host triggers a start command launch sequence
      serverRoomRef.child('gameState').on('value', (snap) => {
        if (snap.val() === "active") {
          window.location.href = 'game.html';
        }
      });

      // 2. Stream all currently connected users onto everyone's screens in real time
      serverRoomRef.child('players').on('value', (snap) => {
        const listContainer = document.getElementById('lobbyRosterLiveContainer');
        listContainer.innerHTML = '';
        const playersData = snap.val() || {};
        
        const keyIdsArray = Object.keys(playersData);
        
        // The first player to connect is appointed the Host and gets the "Launch Match" button
        if (keyIdsArray.length > 0 && keyIdsArray[0] === uniqueAssignedPlayerKey) {
          document.getElementById('hostLaunchMatchBtn').style.display = 'block';
        }

        keyIdsArray.forEach(id => {
          const p = playersData[id];
          const div = document.createElement('div');
          div.style.cssText = "background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.1); padding:10px 14px; border-radius:6px; color:#fff; text-align:left; font-weight:600; font-size:0.95rem; display:flex; justify-content:space-between; align-items:center;";
          div.innerHTML = `<span>👤 ${p.name}</span> <span style="color:var(--cyan); font-size:0.75rem; font-family:'Share Tech Mono';">[READY]</span>`;
          listContainer.appendChild(div);
        });
      });
    }

    // Trigger game startup command pipeline across all screens
    document.getElementById('hostLaunchMatchBtn').addEventListener('click', () => {
      serverRoomRef.update({ gameState: "active" });
    });

    // Auto-login check if the user accidentally reloads but is already registered in the lobby
    if (uniqueAssignedPlayerKey && localStorage.getItem('mp_myPlayerName')) {
      document.getElementById('playerJoinNameInput').value = localStorage.getItem('mp_myPlayerName');
    }
  </script>
</body>
</html>
